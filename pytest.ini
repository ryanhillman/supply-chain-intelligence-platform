[pytest]
testpaths = tests
# Spark's packages (config, jobs, utils) and the serving container's modules
# (main, predictor) are top-level names inside their images, so the tests
# import them the same way. Everything else comes from `pip install -e .`.
pythonpath = spark model_serving/serving/container
markers =
    slow: needs PySpark and Java 17; CI runs these in the Spark job, with a Bigtable emulator
