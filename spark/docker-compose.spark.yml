# Spark jobs. Bronze, Silver, checkpoints and the DLQ go to GCS; feature rows
# go to Bigtable. Copy .env.example to .env and fill it in first; the Kafka
# stack must be up (it creates the kafka_scip-net network).
#
# The service-account key is created outside Terraform and gitignored:
#   gcloud iam service-accounts keys create infrastructure/gcp/keys/scip-spark-sa.json \
#       --iam-account scip-spark-sa@<project>.iam.gserviceaccount.com
#
#   docker build -t scip-spark:latest .
#   docker compose -f docker-compose.spark.yml up -d spark-bronze
#   docker compose -f docker-compose.spark.yml run --rm spark-silver-batch

x-spark: &spark
  image: scip-spark:latest
  env_file: .env
  # spark-submit with the flags every job shares. A service's command adds
  # its own flags and the job file.
  entrypoint:
    - "/opt/spark/bin/spark-submit"
    - "--master"
    - "${SPARK_MASTER:-local[*]}"
    - "--conf"
    - "spark.jars.ivy=${IVY_CACHE:-/opt/ivy2}"
    - "--conf"
    - "spark.driver.memory=${SPARK_DRIVER_MEMORY:-2g}"
    - "--conf"
    - "spark.executor.memory=${SPARK_EXECUTOR_MEMORY:-2g}"
    # GCS connector settings.
    - "--properties-file"
    - "config/spark-gcs.conf"
  volumes:
    # Source mount — live-reload job code without rebuild.
    - .:/opt/spark-app
    # Service-account key, read-only. The file must exist before `docker compose up`.
    - ../infrastructure/gcp/keys/scip-spark-sa.json:/opt/spark-app/keys/scip-spark-sa.json:ro
    # Ivy JAR cache — persists Kafka connector JARs across container restarts.
    - spark-ivy-cache:/opt/ivy2
  networks:
    - kafka_scip-net
  mem_limit: 1536m

services:
  spark-bronze:
    <<: *spark
    command:
      - "--packages"
      - "${KAFKA_PACKAGE}"
      - "--conf"
      - "spark.kafka.consumer.cache.enabled=false"
      - "jobs/bronze_ingestion.py"
    restart: on-failure:3

  # ── Silver features (batch, as of a date) ───────────────────────────────────
  # jobs/silver_batch.py: computes one feature snapshot per pair as of a date,
  # writes Silver and the Bigtable rows, and exits. Profile-gated so `up -d`
  # does not start it; run it explicitly (SILVER_AS_OF defaults to the latest
  # day in Bronze; SILVER_FROM also writes every day from that date on):
  #   docker compose -f docker-compose.spark.yml run --rm spark-silver-batch
  #   docker compose -f docker-compose.spark.yml run --rm -e SILVER_AS_OF=2026-09-30 spark-silver-batch
  #   docker compose -f docker-compose.spark.yml run --rm -e SILVER_FROM=2025-10-31 spark-silver-batch
  spark-silver-batch:
    <<: *spark
    profiles: ["batch"]
    command: ["jobs/silver_batch.py"]

volumes:
  spark-ivy-cache:

networks:
  kafka_scip-net:
    external: true
