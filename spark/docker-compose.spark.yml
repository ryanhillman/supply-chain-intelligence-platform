# Spark jobs. By default everything is local: Bronze, Silver, checkpoints and
# the DLQ go to spark/data/ (this directory is mounted at /opt/spark-app) and
# feature rows go to the Bigtable emulator from local/docker-compose.emulators.yml.
# Copy .env.example to .env first; the Kafka stack must be up (it creates the
# kafka_scip-net network).
#
#   docker build -t scip-spark:latest .
#   docker compose -f docker-compose.spark.yml up -d spark-bronze
#   docker compose -f docker-compose.spark.yml run --rm spark-silver-batch
#
# The GCS --conf lines are inert unless the storage paths in .env are gs://
# URIs. That was the June 2026 GCP deployment; for it, add the override that
# mounts the service-account key:
#   docker compose -f docker-compose.spark.yml -f docker-compose.gcp.yml up -d

x-spark: &spark
  image: scip-spark:latest
  env_file: .env
  volumes:
    # Source mount — live-reload job code without rebuild; data/ under it is
    # where the local run's Parquet and checkpoints land on the host.
    - .:/opt/spark-app
    # Ivy JAR cache — persists Kafka connector JARs across container restarts.
    - spark-ivy-cache:/opt/ivy2
  networks:
    - kafka_scip-net
  mem_limit: 1536m

services:
  spark-bronze:
    <<: *spark
    command:
      - "--master"
      - "${SPARK_MASTER:-local[*]}"
      - "--packages"
      - "${KAFKA_PACKAGE}"
      - "--conf"
      - "spark.jars.ivy=${IVY_CACHE:-/opt/ivy2}"
      - "--conf"
      - "spark.driver.memory=${SPARK_DRIVER_MEMORY:-2g}"
      - "--conf"
      - "spark.executor.memory=${SPARK_EXECUTOR_MEMORY:-2g}"
      - "--conf"
      - "spark.kafka.consumer.cache.enabled=false"
      # ── GCS connector configuration (gs:// paths only) ──────────────────────
      - "--conf"
      - "spark.hadoop.fs.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem"
      - "--conf"
      - "spark.hadoop.fs.AbstractFileSystem.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS"
      - "--conf"
      - "spark.hadoop.google.cloud.auth.service.account.enable=true"
      - "--conf"
      - "spark.hadoop.google.cloud.auth.service.account.json.keyfile=${GOOGLE_APPLICATION_CREDENTIALS:-/opt/spark-app/keys/scip-spark-sa.json}"
      - "--conf"
      - "spark.hadoop.fs.gs.outputstream.type=FLUSHABLE_COMPOSITE"
      - "--conf"
      - "spark.hadoop.fs.gs.implicit.dir.infer.enable=true"
      # ── Job entrypoint ──────────────────────────────────────────────────────
      - "jobs/bronze_ingestion.py"
    restart: on-failure:3

  # ── Silver features (batch, as of a date) ───────────────────────────────────
  # jobs/silver_batch.py: computes one feature snapshot per pair as of a date,
  # writes Silver and the Bigtable rows, and exits. Profile-gated so `up -d`
  # does not start it; run it explicitly (SILVER_AS_OF defaults to the latest
  # day in Bronze):
  #   docker compose -f docker-compose.spark.yml run --rm spark-silver-batch
  #   docker compose -f docker-compose.spark.yml run --rm -e SILVER_AS_OF=2026-09-30 spark-silver-batch
  spark-silver-batch:
    <<: *spark
    profiles: ["batch"]
    command:
      - "--master"
      - "${SPARK_MASTER:-local[*]}"
      - "--conf"
      - "spark.jars.ivy=${IVY_CACHE:-/opt/ivy2}"
      - "--conf"
      - "spark.driver.memory=${SPARK_DRIVER_MEMORY:-2g}"
      - "--conf"
      - "spark.executor.memory=${SPARK_EXECUTOR_MEMORY:-2g}"
      # ── GCS connector configuration (gs:// paths only) ──────────────────────
      - "--conf"
      - "spark.hadoop.fs.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem"
      - "--conf"
      - "spark.hadoop.fs.AbstractFileSystem.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS"
      - "--conf"
      - "spark.hadoop.google.cloud.auth.service.account.enable=true"
      - "--conf"
      - "spark.hadoop.google.cloud.auth.service.account.json.keyfile=${GOOGLE_APPLICATION_CREDENTIALS:-/opt/spark-app/keys/scip-spark-sa.json}"
      - "--conf"
      - "spark.hadoop.fs.gs.outputstream.type=FLUSHABLE_COMPOSITE"
      - "--conf"
      - "spark.hadoop.fs.gs.implicit.dir.infer.enable=true"
      # ── Job entrypoint ──────────────────────────────────────────────────────
      - "jobs/silver_batch.py"

volumes:
  spark-ivy-cache:

networks:
  kafka_scip-net:
    external: true
