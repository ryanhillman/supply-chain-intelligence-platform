# GCS connector settings for the Spark jobs. docker-compose.spark.yml and
# scripts/validate_pipeline.sh pass this file to spark-submit with
# --properties-file. The key file path is where both mount the service-account key.
spark.hadoop.fs.gs.impl                                      com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem
spark.hadoop.fs.AbstractFileSystem.gs.impl                   com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS
spark.hadoop.google.cloud.auth.service.account.enable        true
spark.hadoop.google.cloud.auth.service.account.json.keyfile  /opt/spark-app/keys/scip-spark-sa.json
spark.hadoop.fs.gs.outputstream.type                         FLUSHABLE_COMPOSITE
spark.hadoop.fs.gs.implicit.dir.infer.enable                 true
